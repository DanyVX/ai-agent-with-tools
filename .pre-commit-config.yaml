repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: strict typecheck
        entry: mypy src/agentx
        language: system
        pass_filenames: false
      - id: gitleaks
        name: gitleaks staged secret scan
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx-runtime"
version = "0.0.0"
description = "A transparent, budget-limited tool-using agent runtime (under construction)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "typer==0.26.3",
  "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "pytest-asyncio==1.3.0",
  "hypothesis==6.168.5",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "pre-commit==4.6.2",
  "pip-audit==2.10.1",
]

[project.scripts]
agentx = "agentx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/agentx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=agentx --cov-report=term-missing --cov-fail-under=70"
markers = ["slow: opt-in expensive tests", "gpu: opt-in GPU tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["agentx"]
omit = ["src/agentx/cli.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

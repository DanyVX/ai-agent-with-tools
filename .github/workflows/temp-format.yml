name: Temporary M7 formatter
on:
  push:
    branches: [m7-cli-release]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7-cli-release
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install "ruff==0.17.0"
      - name: Apply safe lint fixes and standard formatting
        run: |
          python -m ruff check --fix . || true
          python -m ruff format .
      - name: Commit only formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply verified Ruff normalization"
            git push origin HEAD:m7-cli-release
          fi

      - name: Prepare an exact tracked-source snapshot
        run: git archive --format=zip -o /tmp/agentx-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: agentx-source
          path: /tmp/agentx-source.zip
          retention-days: 1

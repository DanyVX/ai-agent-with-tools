name: Source Snapshot
on:
  push:
    branches: [m7-cli-release]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source
        run: git archive --format=zip --output agentx-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: agentx-source
          path: agentx-source.zip
          retention-days: 1

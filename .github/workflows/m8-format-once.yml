name: One-time M8 format
on:
  push:
    branches: [m8-provider-tool-roundtrips]
    paths:
      - .github/workflows/m8-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8-provider-tool-roundtrips
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install "ruff==0.17.0"
      - name: Apply project formatting
        run: |
          python -m ruff format src/agentx/llm/transcript.py tests/test_provider_roundtrip.py
          python -m ruff check src/agentx/llm/transcript.py tests/test_provider_roundtrip.py
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agentx/llm/transcript.py tests/test_provider_roundtrip.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply pinned Ruff formatter to M8 provider tests"
            git push origin HEAD:m8-provider-tool-roundtrips
          fi
